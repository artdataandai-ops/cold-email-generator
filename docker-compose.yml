services:
  app:
    build: .
    image: cold-email-research:latest
    container_name: cold-email-research
    restart: unless-stopped
    ports:
      # Host 4766 (47xx app range) — the edge nginx proxies /coldemail/ here.
      - "4766:8000"
    environment:
      # Served behind the edge proxy under /coldemail/ (prefix stripped upstream).
      # Overrides any ROOT_PATH in .env; clear it to run standalone at "/".
      - ROOT_PATH=/coldemail
    env_file:
      - .env
    volumes:
      - ./kb:/app/kb            # SQLite DB (sender profiles)
      - ./logs:/app/logs        # per-request JSON logs
      - ./.cache:/app/.cache    # ScrapeGraphAI fetch cache + LinkedIn cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
